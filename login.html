<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вхід — OLYMP Government</title>

    <meta
        name="description"
        content="Вхід до особистого кабінету OLYMP Government"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #163457 0%,
                    #08111f 45%,
                    #030811 100%
                );

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 15px;

        }


        .page {

            width: 100%;

            max-width: 520px;

        }


        /* =================================================
           HEADER
        ================================================= */

        .header {

            text-align: center;

            margin-bottom: 25px;

        }


        .logo {

            width: 78px;

            height: 78px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #1d8fff,
                    #0050a8
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: 800;

            box-shadow:
                0 0 35px
                rgba(
                    0,
                    132,
                    255,
                    0.35
                );

        }


        .header h1 {

            font-size: 28px;

            font-weight: 800;

            letter-spacing: 0.5px;

            margin-bottom: 7px;

        }


        .header p {

            color: #91a4bd;

            font-size: 14px;

        }


        /* =================================================
           CARD
        ================================================= */

        .card {

            background:
                rgba(
                    10,
                    23,
                    39,
                    0.94
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 25px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter:
                blur(15px);

        }


        .section-title {

            font-size: 19px;

            font-weight: 700;

            margin-bottom: 20px;

        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message {

            display: none;

            padding: 13px 15px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.5;

        }


        .message.error {

            display: block;

            background:
                rgba(
                    220,
                    53,
                    69,
                    0.12
                );

            border:
                1px solid
                rgba(
                    220,
                    53,
                    69,
                    0.25
                );

            color:
                #ff8d96;

        }


        .message.success {

            display: block;

            background:
                rgba(
                    40,
                    167,
                    69,
                    0.12
                );

            border:
                1px solid
                rgba(
                    40,
                    167,
                    69,
                    0.25
                );

            color:
                #79e89a;

        }


        /* =================================================
           FORM
        ================================================= */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color:
                #dbe7f5;

            font-size: 13px;

            font-weight: 600;

        }


        .required {

            color:
                #ff6b6b;

        }


        input {

            width: 100%;

            height: 50px;

            padding:
                0 15px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 11px;

            background:
                #071525;

            color:
                #ffffff;

            outline: none;

            font-size: 14px;

            transition:
                0.2s ease;

        }


        input::placeholder {

            color:
                #647891;

        }


        input:focus {

            border-color:
                #168cff;

            box-shadow:
                0 0 0 3px
                rgba(
                    22,
                    140,
                    255,
                    0.12
                );

        }


        /* =================================================
           PASSWORD
        ================================================= */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 52px;

        }


        .show-password {

            position: absolute;

            right: 0;

            top: 0;

            width: 50px;

            height: 50px;

            border: 0;

            background:
                transparent;

            color:
                #7890aa;

            cursor: pointer;

            font-size: 16px;

        }


        .show-password:hover {

            color:
                #ffffff;

        }


        /* =================================================
           OPTIONS
        ================================================= */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin:
                3px 0 22px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 8px;

            color:
                #8ea1b8;

            font-size: 12px;

            cursor: pointer;

        }


        .remember input {

            width: 16px;

            height: 16px;

            accent-color:
                #168cff;

        }


        .forgot {

            color:
                #4da5ff;

            text-decoration:
                none;

            font-size: 12px;

        }


        .forgot:hover {

            text-decoration:
                underline;

        }


        /* =================================================
           BUTTON
        ================================================= */

        .submit-button {

            width: 100%;

            height: 52px;

            border: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #0064c7
                );

            color:
                #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                0.2s ease;

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    112,
                    255,
                    0.22
                );

        }


        .submit-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 12px 30px
                rgba(
                    0,
                    112,
                    255,
                    0.32
                );

        }


        .submit-button:disabled {

            opacity:
                0.55;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /* =================================================
           REGISTER
        ================================================= */

        .register-box {

            text-align:
                center;

            margin-top:
                23px;

            padding-top:
                20px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color:
                #71859d;

            font-size:
                12px;

        }


        .register-box a {

            color:
                #4da5ff;

            text-decoration:
                none;

            font-weight:
                600;

        }


        .register-box a:hover {

            text-decoration:
                underline;

        }


        /* =================================================
           LOADER
        ================================================= */

        .loader {

            width:
                18px;

            height:
                18px;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            border-top-color:
                #ffffff;

            border-radius:
                50%;

            display:
                inline-block;

            vertical-align:
                middle;

            margin-right:
                8px;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =================================================
           FOOTER
        ================================================= */

        .footer {

            text-align:
                center;

            margin-top:
                20px;

            color:
                #60758d;

            font-size:
                12px;

        }


        .footer a {

            color:
                #4da5ff;

            text-decoration:
                none;

        }


        .footer a:hover {

            text-decoration:
                underline;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 600px
        ) {

            .card {

                padding:
                    22px 18px;

            }


            .header h1 {

                font-size:
                    24px;

            }


            .options {

                align-items:
                    flex-start;

                gap:
                    10px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">


        <div class="logo">

            OG

        </div>


        <h1>

            OLYMP GOVERNMENT

        </h1>


        <p>

            Особистий кабінет громадянина

        </p>


    </div>


    <!-- =================================================
         CARD
    ================================================= -->

    <div class="card">


        <div class="section-title">

            Вхід до особистого кабінету

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             FORM
        ================================================= -->

        <form
            id="loginForm"
            autocomplete="off"
        >


            <!-- OLYMP ID -->

            <div class="form-group">


                <label for="olympId">

                    OLYMP-ID

                    <span class="required">

                        *

                    </span>

                </label>


                <input
                    type="text"
                    id="olympId"
                    name="olympId"
                    placeholder="Наприклад: OLYMP-000001"
                    maxlength="30"
                    autocomplete="username"
                    required
                >


            </div>


            <!-- PASSWORD -->

            <div class="form-group">


                <label for="password">

                    Пароль

                    <span class="required">

                        *

                    </span>

                </label>


                <div class="password-wrapper">


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введіть пароль"
                        maxlength="100"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Показати пароль"
                    >

                        👁

                    </button>


                </div>


            </div>


            <!-- OPTIONS -->

            <div class="options">


                <label class="remember">


                    <input
                        type="checkbox"
                        id="rememberMe"
                    >


                    <span>

                        Запам'ятати мене

                    </span>


                </label>


                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >

                    Забули пароль?

                </a>


            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >

                Увійти

            </button>


        </form>


        <!-- REGISTER -->

        <div class="register-box">


            Ще не маєте облікового запису?


            <a href="registration.html">

                Зареєструватися

            </a>


        </div>


    </div>


    <!-- =================================================
         FOOTER
    ================================================= -->

    <div class="footer">


        OLYMP Government


        ·


        <a href="index.html">

            На головну

        </a>


    </div>


</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyynbAxu6A_tU5nBEUum357BCY6o8D-3e44wEtR-AlyOtV5un8mNgpmkvU6dtrIy0RvfQ/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const message =
    document.getElementById(
        "message"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const olympIdInput =
    document.getElementById(
        "olympId"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const rememberMe =
    document.getElementById(
        "rememberMe"
    );


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

document
    .getElementById(
        "showPassword"
    )
    .addEventListener(
        "click",
        function() {


            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                this.textContent =
                    "🙈";

            } else {

                passwordInput.type =
                    "password";

                this.textContent =
                    "👁";

            }


        }
    );


/* =========================================================
   NORMALIZE OLYMP-ID
========================================================= */

function normalizeOlympId(
    value
) {

    return String(value || "")
        .trim()
        .toUpperCase();

}


/* =========================================================
   RESET BUTTON
========================================================= */

function resetButton() {

    submitButton.disabled =
        false;

    submitButton.textContent =
        "Увійти";

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        hideMessage();


        /* =============================================
           DATA
        ============================================= */

        const olympId =
            normalizeOlympId(
                olympIdInput.value
            );


        const password =
            passwordInput.value;


        /* =============================================
           VALIDATION
        ============================================= */

        if (
            !olympId
        ) {

            showMessage(
                "Введіть OLYMP-ID."
            );

            return;

        }


        if (
            !/^OLYMP-\d{4,12}$/.test(
                olympId
            )
        ) {

            showMessage(
                "Невірний формат OLYMP-ID. Приклад: OLYMP-000001."
            );

            return;

        }


        if (
            !password
        ) {

            showMessage(
                "Введіть пароль."
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showMessage(
                "Пароль повинен містити щонайменше 6 символів."
            );

            return;

        }


        if (
            !GOOGLE_SCRIPT_URL
        ) {

            showMessage(
                "Не налаштовано адресу Google Apps Script."
            );

            return;

        }


        /* =============================================
           BUTTON
        ============================================= */

        submitButton.disabled =
            true;


        submitButton.innerHTML =
            '<span class="loader"></span> Вхід...';


        /* =============================================
           REQUEST DATA
        ============================================= */

        const formData =
            new URLSearchParams();


        formData.append(
            "action",
            "login"
        );


        formData.append(
            "olympId",
            olympId
        );


        formData.append(
            "password",
            password
        );


        /* =============================================
           REQUEST
        ============================================= */

        try {


            const response =
                await fetch(
                    GOOGLE_SCRIPT_URL,
                    {

                        method:
                            "POST",

                        body:
                            formData

                    }
                );


            const rawText =
                await response.text();


            let result;


            try {

                result =
                    JSON.parse(
                        rawText
                    );

            } catch (
                jsonError
            ) {

                console.error(
                    "Google Apps Script response:",
                    rawText
                );


                throw new Error(
                    "INVALID_SERVER_RESPONSE"
                );

            }


            /* =========================================
               LOGIN ERROR
            ========================================= */

            if (
                !result.success
            ) {

                showMessage(

                    result.message ||
                    "Невірний OLYMP-ID або пароль."

                );


                resetButton();


                return;

            }


            /* =========================================
               USER
            ========================================= */

            const user =
                result.user;


            if (
                !user ||
                !user.olympId
            ) {

                showMessage(
                    "Сервер не повернув дані користувача."
                );


                resetButton();


                return;

            }


            /* =========================================
               SAVE SESSION
            ========================================= */

            const sessionUser = {

                olympId:
                    user.olympId,

                fullName:
                    user.fullName || "",

                birthDate:
                    user.birthDate || "",

                phone:
                    user.phone || "",

                email:
                    user.email || "",

                discord:
                    user.discord || "",

                status:
                    user.status ||
                    "Активний"

            };


            /*
             * ВАЖЛИВО:
             * Пароль тут НЕ зберігається.
             */


            if (
                rememberMe.checked
            ) {

                localStorage.setItem(
                    "olymp_user",
                    JSON.stringify(
                        sessionUser
                    )
                );


                localStorage.setItem(
                    "olymp_id",
                    sessionUser.olympId
                );


                localStorage.setItem(
                    "olymp_remember",
                    "true"
                );

            } else {

                sessionStorage.setItem(
                    "olymp_user",
                    JSON.stringify(
                        sessionUser
                    )
                );


                sessionStorage.setItem(
                    "olymp_id",
                    sessionUser.olympId
                );


                sessionStorage.setItem(
                    "olymp_remember",
                    "false"
                );


                /*
                 * Якщо раніше було
                 * "Запам'ятати мене",
                 * очищаємо стару сесію.
                 */

                localStorage.removeItem(
                    "olymp_user"
                );

                localStorage.removeItem(
                    "olymp_id"
                );

                localStorage.removeItem(
                    "olymp_remember"
                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(
                "Вхід успішний. Перенаправлення...",
                "success"
            );


            /*
             * Невелика затримка,
             * щоб користувач побачив повідомлення.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "cabinet.html";

                },
                500
            );


        } catch (
            error
        ) {


            console.error(
                error
            );


            if (
                error.message ===
                "INVALID_SERVER_RESPONSE"
            ) {

                showMessage(
                    "Google Apps Script повернув некоректну відповідь. Перевірте публікацію Web App та актуальність Code.gs 6.0."
                );

            } else {

                showMessage(
                    "Помилка з'єднання з сервером. Перевірте URL Google Apps Script та налаштування доступу."
                );

            }


            resetButton();


        }


    }
);


/* =========================================================
   LOAD SAVED USER
========================================================= */

(function loadSavedUser() {


    const savedUser =
        localStorage.getItem(
            "olymp_user"
        );


    const savedId =
        localStorage.getItem(
            "olymp_id"
        );


    const remember =
        localStorage.getItem(
            "olymp_remember"
        );


    if (
        savedUser &&
        savedId &&
        remember === "true"
    ) {


        try {


            const user =
                JSON.parse(
                    savedUser
                );


            if (
                user &&
                user.olympId
            ) {

                olympIdInput.value =
                    user.olympId;

                rememberMe.checked =
                    true;

            }


        } catch (
            error
        ) {


            console.error(
                "Помилка читання збереженого профілю:",
                error
            );


            localStorage.removeItem(
                "olymp_user"
            );


            localStorage.removeItem(
                "olymp_id"
            );


            localStorage.removeItem(
                "olymp_remember"
            );


        }


    }


})();


/* =========================================================
   FORGOT PASSWORD
========================================================= */

document
    .getElementById(
        "forgotPassword"
    )
    .addEventListener(
        "click",
        function(event) {


            event.preventDefault();


            showMessage(
                "Для відновлення пароля зверніться до адміністрації OLYMP Government."
            );


        }
    );


/* =========================================================
   CLEAN INPUT
========================================================= */

olympIdInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(
                    /[^a-zA-Z0-9-]/g,
                    ""
                )
                .toUpperCase();

    }
);


</script>


</body>

</html>
